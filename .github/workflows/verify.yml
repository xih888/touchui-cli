name: 跨平台验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: '16.20.2'
          - os: windows-latest
            node: '22'
          - os: windows-latest
            node: '24'
          - os: macos-15-intel
            node: '22'
          - os: macos-15-intel
            node: '24'
          - os: macos-15
            node: '22'
          - os: macos-15
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:integration
